version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # closing a file/stream opened for reading cannot fail meaningfully
      exclude-functions:
        - (*os.File).Close
        - (io.ReadCloser).Close

formatters:
  enable:
    - gofmt
    - goimports
